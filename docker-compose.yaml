services:
    032musicplayer:
        container_name: 032musicplayer
        build: .
        image: "032musicplayer:latest"
        restart: unless-stopped
        environment:
            - SERVER_NAME=032music # pre-defined server name
            - SERVER_LOCK=false # When true AND name/type/url are set, only the credentials can be changed
            - SERVER_TYPE=music032 # 032 Music Server
            - SERVER_URL=https://music.example.com # address of your 032 Music Server (http://address:port or https://address)
        ports:
            - 9180:9180
            # Alternatively, to restrict to only localhost, - 127.0.0.1:9180:9180
