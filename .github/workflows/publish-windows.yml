name: Publish Windows

on:
    push:
        branches:
            - 032music
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - '.scratch/**'
    workflow_dispatch:

# A newer push supersedes an in-flight build of the same release.
concurrency:
    group: publish-windows
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ${{ matrix.os }}

        permissions:
            contents: write

        strategy:
            matrix:
                os: [windows-latest]

        steps:
            - name: Checkout git repo
              uses: actions/checkout@v6

            - name: Install Node and PNPM
              uses: pnpm/action-setup@v5

            - name: Install dependencies
              run: pnpm install

            # electron-builder skips uploads to an already published release with the same version,
            # so reopen it as a draft and let the build overwrite its assets.
            - name: Reopen existing release as draft
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="v$(node -p "require('./package.json').version")"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release edit "$tag" --draft=true
                  fi

            - name: Build and Publish releases
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-fields/retry@v4
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run publish:win
                  on_retry_command: pnpm cache delete

            # electron-builder only creates a draft release; publish it once the upload succeeded.
            - name: Publish draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false
